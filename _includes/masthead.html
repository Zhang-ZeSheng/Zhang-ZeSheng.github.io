<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about" aria-label="Back to top">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    {% if page.counters != false %}
    <div class="masthead__stats" aria-label="Site statistics">
      <span class="masthead__stat" title="页面浏览量">
        <span class="masthead__stat-icon" aria-hidden="true">👁</span>
        <span class="masthead__stat-value" id="site-views">--</span>
        <span class="masthead__stat-label">浏览</span>
      </span>
      <span class="masthead__stat-separator" aria-hidden="true"></span>
      <span class="masthead__stat" title="有效内容点击量">
        <span class="masthead__stat-icon" aria-hidden="true">👆</span>
        <span class="masthead__stat-value" id="site-clicks">--</span>
        <span class="masthead__stat-label">点击</span>
      </span>
    </div>
    {% endif %}
  </div>
</div>
