{% assign counter_namespace = site.counter_namespace | default: "zhang-zesheng-homepage-v3" %}
<script>
(function () {
  "use strict";

  var API = "https://abacus.jasoncameron.dev";
  var NAMESPACE = "{{ counter_namespace | escape }}";
  var VIEW_KEY = "views";
  var CLICK_KEY = "clicks";
  var viewEl = document.getElementById("site-views");
  var clickEl = document.getElementById("site-clicks");

  if (!viewEl || !clickEl) return;

  var localPrefix = "zzs-counter:" + NAMESPACE + ":";
  var viewLocalKey = localPrefix + VIEW_KEY;
  var clickLocalKey = localPrefix + CLICK_KEY;
  var remoteValues = {};

  function readLocal(key) {
    try {
      return parseInt(localStorage.getItem(key), 10) || 0;
    } catch (e) {
      return 0;
    }
  }

  function writeLocal(key, value) {
    try {
      localStorage.setItem(key, String(value));
    } catch (e) {}
  }

  function incrementLocal(key) {
    var next = readLocal(key) + 1;
    writeLocal(key, next);
    return next;
  }

  function format(value) {
    return Number(value || 0).toLocaleString("en-US");
  }

  function show(el, value) {
    if (el) {
      el.textContent = value == null ? "--" : format(value);
    }
  }

  function showRemote(el, value) {
    var numeric = Number(value);
    if (!isFinite(numeric)) return;

    var previous = remoteValues[el.id] || 0;
    if (numeric < previous) return;

    remoteValues[el.id] = numeric;
    show(el, numeric);
  }

  function count(key, localKey, el) {
    var fallback = incrementLocal(localKey);
    show(el, fallback);
    remoteValues[el.id] = Math.max(remoteValues[el.id] || 0, fallback);

    return fetch(API + "/hit/" + NAMESPACE + "/" + key, {
      method: "GET",
      mode: "cors",
      cache: "no-store",
      keepalive: true
    })
      .then(function (response) {
        if (!response.ok) throw new Error("counter request failed");
        return response.json();
      })
      .then(function (data) {
        showRemote(el, data.value);
      })
      .catch(function () {
        show(el, fallback);
      });
  }

  show(viewEl, readLocal(viewLocalKey));
  show(clickEl, readLocal(clickLocalKey));
  count(VIEW_KEY, viewLocalKey, viewEl);

  document.addEventListener("click", function () {
    count(CLICK_KEY, clickLocalKey, clickEl);
  }, true);
})();
</script>
